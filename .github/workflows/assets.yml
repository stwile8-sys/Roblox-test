name: Ассеты (Open Cloud)

on:
  push:
    branches: [assets]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Загрузить звуки, создать геймпассы и товары
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "1195242587"
          PLACE_ID: "3327609598"
          SERVER_SIZE: "12"
        run: python3 tools/assets/pipeline.py

      - name: Сохранить state.json в ветку
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/assets/state.json || exit 0
          if git diff --cached --quiet; then echo "state.json не изменился"; exit 0; fi
          git commit -m "assets: обновить state.json [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
