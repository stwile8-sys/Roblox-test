name: Модели (Open Cloud)

on:
  push:
    branches: [models]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: models
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Загрузить модели и напечатать asset ID
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          CREATOR_USER_ID: "1124897065"
        run: python3 tools/models/upload.py

      - name: Сохранить ID, state.json и отчёт в ветку
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/models/state.json tools/models/report.md src/shared/Config/Models.luau src/shared/Config/ModelSizes.luau src/shared/Config/ModelPivots.luau docs/MODELS.md || exit 0
          if git diff --cached --quiet; then echo "ничего не изменилось"; exit 0; fi
          git commit -m "models: обновить asset ID [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
